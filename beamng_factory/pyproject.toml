[project]
name = "bfactory"
version = "0.1.0"
description = "BEAMNG YOUTUBE FACTORY - automated BeamNG.drive video production"
requires-python = ">=3.11"
dependencies = [
    "beamngpy==1.36",
    "pydantic>=2.6",
    "psutil>=5.9",
    "Pillow>=10",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
